fading = false;
fade-in-step = 0.02;
fade-out-step = 0.02;
fade-delta = 2;
no-fading-openclose = false
no-fading-destroyed-argb = true

inactive-opacity = 0.93;
# frame-opacity = 0.75;
inactive-opacity-override = false;
active-opacity = 0.95;
inactive-dim = 0.07

opacity-rule = [
#    "86:class_g = 'Spotify'",
#    "90:class_g = 'Kitty'",
    "95:class_g = 'Polybar'",
    "92:class_g = 'zen'",
    "0:_NET_WM_STATE *= '_NET_WM_STATE_HIDDEN'"
];

# Corners
# corner-radius = 20.0;
# round-borders = 20.0;
# rounded-corners-exclude = [ "class_g = 'Polybar'"];

# Shadow
# shadow = true;
# shadow-radius = 20;
# shadow-offset-x = -17;
# shadow-offset-y = -7;
# shadow-opacity = 0.5;
# shadow-exclude = [ "class_g = 'Polybar'"];

# Blur
blur: {
  method = "dual_kawase";
  strength = 10;
  deviation = 0.5;
  kernel = "11x11gaussian";
  background = true;
  background-frame = true;
  background-fixed = false;
  kern = "3x3box";
}
#
# blur-background-exclude = [
# #	"window_type = 'dock'",
# 	"window_type = 'desktop'",
# 	"_GTK_FRAME_EXTENTS@:c"
# ];

backend = "glx";
# backend = "xrender";
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-client-leader = true;
# glx-no-stencil = true;
use-damage = true;
log-level = "info";

# glx-use-copysubbuffer-mesa = true;

glx-copy-from-front = true;
glx-swap-method = 2;
xrender-sync = true;
xrender-sync-fence = true;

wintypes:
{
  tooltip = { fade=true; shadow=true; opacity=0.7; focus=true; full-shadow=false; };
  popup_menu = { fade=true; shadow=true; opacity=0.7; focus=true; full-shadow=false; }
  dropdown_menu = { fade=true; shadow=true; opacity=0.7; focus=true; full-shadow=false; }
  utility = { fade=true; shadow=true; opacity=0.7; focus=true; full-shadow=false; }
};

# Animations

# match = "window_type = 'normal'";

animations = (
    {
    triggers = ["close"];
    opacity = {
    curve = "cubic-bezier(0,1,1,1)";
    duration = 0.3;
    start = "window-raw-opacity-before";
    end = 0;
    };

    blur-opacity = "opacity";
    shadow-opacity = "opacity";

    scale-x = {
    curve = "cubic-bezier(0,1.3,1,1)";
    duration = 0.3;
    start = 1;
    end = 0.6;

    };

    scale-y = "scale-x";

    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";

    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
    },
{

  triggers = ["open"];
  opacity = {
    curve = "cubic-bezier(0,1,1,1)";
    duration = 0.3;
    start = 0;

    end = "window-raw-opacity";
  };

  blur-opacity = "opacity";
  shadow-opacity = "opacity";

  scale-x = {
    curve = "cubic-bezier(0,1.3,1,1)";
    duration = 0.4;
    start = 0.5;
    end = 1;
  };

  scale-y = "scale-x";
  offset-x = "(1 - scale-x) / 2 * window-width";
  offset-y = "(1 - scale-y) / 2 * window-height";

  shadow-scale-x = "scale-x";
  shadow-scale-y = "scale-y";
  shadow-offset-x = "offset-x";
  shadow-offset-y = "offset-y";

},

{
  triggers = ["geometry"];

  scale-x = {
    curve = "cubic-bezier(0,0,0,1.28)";
    duration = 0.5;
    start = "window-width-before / window-width";
    end = 1;
  };

  scale-x-reverse = {
    curve = "cubic-bezier(0,0,0,1.28)";
    duration = 0.3;
    start = "window-width / window-width-before";
    end = 1;

  };

  scale-y = {
    curve = "cubic-bezier(0,0,0,1.28)";
    duration = 0.3;
    start = "window-height-before / window-height";
    end = 1;
  };

  scale-y-reverse = {
    curve = "cubic-bezier(0,0,0,1.28)";
    duration = 0.3;
    start = "window-height / window-height-before";
    end = 1;

  };

  offset-x = {
    curve = "cubic-bezier(0,0,0,1.28)";

    duration = 0.3;
    start = "window-x-before - window-x";
    end = 0;

  };

  offset-y = {
    curve = "cubic-bezier(0,0,0,1.28)";
    duration = 0.3;
    start = "window-y-before - window-y";
    end = 0;

  };

  shadow-scale-x = "scale-x";
  shadow-scale-y = "scale-y";
  shadow-offset-x = "offset-x";
  shadow-offset-y = "offset-y";
}
)
