[ids]
*

include layouts/dvorak

[global]
default_layout = dvorak

[dvorak:layout]
grave = $
minus = !
equal = |
leftbrace = /
rightbrace = @
right = rightcontrol
leftmeta+leftshift+f23 = f23

[dvorak_shift]
grave = ~
1 = +
2 = [
3 = {
4 = (
5 = &
6 = =
7 = )
8 = }
9 = ]
0 = *
minus = %
equal = `
leftbrace = ?
rightbrace = ^
backslash = #
